name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  schedule:
    # Schedule weekly builds on master, to ensure that the Docker image gets
    # rebuilt regularly (in order to include security fixes in the base image).
    - cron: '5 4 * * 5'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3"
          bundler-cache: true
      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "https://www.open-ost.ch"
        env:
          JEKYLL_ENV: production
      - name: Upload generated site
        uses: actions/upload-artifact@v7
        with:
          name: jekyll-site
          path: _site/
          if-no-files-found: error
  publish:
    name: publish docker image
    runs-on: ubuntu-latest
    needs: build
    env:
      DOCKER_USERNAME: "${{ secrets.DOCKER_USERNAME }}"
      DOCKER_PASSWORD: "${{ secrets.DOCKER_PASSWORD }}"
    steps:
      - uses: actions/checkout@v7
      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          path: _site/
      - name: create clean docker build context
        run: |
          set -euo pipefail

          rm -rf docker-context
          mkdir -p docker-context

          cp docker/Dockerfile-prod docker-context/Dockerfile
          cp -a _site docker-context/_site

          echo "Docker build context:"
          find docker-context -maxdepth 3 -type f | sort

          test -d docker-context/_site
          test -f docker-context/_site/index.html || \
            test -f docker-context/_site/app/index.html
      - name: Fetch repository tags (for git describe to work)
        run: git fetch --prune --unshallow
      - name: Determine image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          RELEASE="$(git describe --tags --always --dirty)"

          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./docker-context
          file: ./docker-context/Dockerfile
          push: true
          tags: |
            openhsr/openost:latest
            openhsr/openost:${{ steps.tags.outputs.release }}
